<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>栖 · 生活工作台</title>
<style>
/* ============ 设计系统 ============ */
:root{
  --bg:#F4F1EA;            /* 主背景 米白 */
  --surface:#FBFAF6;       /* 卡片 */
  --surface-2:#EFEADD;
  --ink:#1C1B18;           /* 主文字 */
  --ink-2:#5A574F;         /* 次文字 */
  --ink-3:#9A958A;         /* 弱文字 */
  --line:#E3DECF;          /* 分隔线 */
  --line-2:#D8D2C0;
  --moss:#3F5340;          /* 苔绿 正向 */
  --moss-soft:#E4E9DF;
  --clay:#B5604A;          /* 陶土 支出/警示 */
  --clay-soft:#F0E0D8;
  --gold:#B89254;          /* 暖金 高亮 */
  --gold-soft:#F0E9D6;
  --sky:#5A7A86;           /* 雾青 信息 */
  --sky-soft:#DDE6E8;
  --radius:6px;
  --radius-lg:10px;
  --shadow:0 1px 2px rgba(28,27,24,.04), 0 4px 16px rgba(28,27,24,.04);
  --serif:'Georgia','Songti SC','Source Han Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
ul{list-style:none;}

/* ============ 应用框架 ============ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;background:var(--bg);}
.app-header{
  flex-shrink:0;padding:14px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);
  padding-top:max(14px,env(safe-area-inset-top));
}
.app-header .title{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.5px;}
.hdr-back{display:inline-block;margin-right:10px;font-size:20px;color:var(--ink-2);cursor:pointer;vertical-align:1px;}
.hdr-back:active{opacity:.5;}
.app-header .title small{font-family:var(--sans);font-size:11px;color:var(--ink-3);letter-spacing:2px;display:block;margin-top:-2px;}
.app-header .actions{display:flex;gap:6px;}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2);}
.icon-btn:active{background:var(--surface-2);}
.icon-btn svg{width:20px;height:20px;}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
.page{display:none;padding:8px 20px max(100px,calc(84px + env(safe-area-inset-bottom)));animation:fade .3s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.tabbar{
  flex-shrink:0;display:flex;background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  position:relative;z-index:5;
}
.tab{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10px;letter-spacing:1px;transition:color .2s;}
.tab svg{width:21px;height:21px;stroke-width:1.6;}
.tab.active{color:var(--ink);}
.tab.active svg{stroke:var(--moss);}

/* ============ 通用组件 ============ */
.section{margin-bottom:24px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
.section-head h2{font-family:var(--serif);font-size:17px;font-weight:400;}
.section-head .more{font-size:12px;color:var(--ink-3);}
.section-head .more:active{color:var(--moss);}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
.divider{height:1px;background:var(--line);margin:14px 0;border:none;}

.btn{padding:10px 18px;border-radius:var(--radius);font-size:14px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn:active{opacity:.85;}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);}
.btn.moss{background:var(--moss);color:#fff;}
.btn.clay{background:var(--clay);color:#fff;}
.btn.sm{padding:6px 12px;font-size:12px;}
.btn.block{display:flex;width:100%;}

.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.5px;}
.tag.moss{background:var(--moss-soft);color:var(--moss);}
.tag.clay{background:var(--clay-soft);color:var(--clay);}
.tag.gold{background:var(--gold-soft);color:var(--gold);}
.tag.sky{background:var(--sky-soft);color:var(--sky);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px;letter-spacing:1px;}
.field input,.field textarea,.field select{
  width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);font-size:14px;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--moss);}

/* 底部弹出层 */
.sheet-mask{position:fixed;inset:0;background:rgba(28,27,24,.4);z-index:50;display:none;}
.sheet-mask.show{display:block;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-radius:18px 18px 0 0;
  max-width:520px;margin:0 auto;
  max-height:85vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0);}
.sheet-grip{width:36px;height:4px;background:var(--line-2);border-radius:2px;margin:10px auto 0;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;}
.sheet-head h3{font-family:var(--serif);font-size:17px;font-weight:400;}

/* ============ 自定义模态确认框 ============ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(28,27,24,.42);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;transition:opacity .2s ease;
  padding:20px;
}
.modal-backdrop.show{opacity:1;}
.modal-card{
  background:var(--bg);border-radius:var(--radius-lg);
  width:100%;max-width:320px;padding:22px 22px 16px;
  box-shadow:0 10px 40px rgba(28,27,24,.18),0 2px 8px rgba(28,27,24,.08);
  transform:scale(.96);transition:transform .2s ease;
}
.modal-backdrop.show .modal-card{transform:scale(1);}
.modal-title{
  font-family:var(--serif);font-size:18px;font-weight:400;
  color:var(--ink);margin-bottom:10px;letter-spacing:.5px;
}
.modal-body{
  font-size:13px;color:var(--ink-2);line-height:1.85;
  margin-bottom:18px;
}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;padding:11px 0;font-size:13px;}
.sheet-body{padding:6px 20px 24px;}

/* toast */
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(28,27,24,.92);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80%;text-align:center;}
#toast.show{opacity:1;}

/* ============ 今日页 ============ */
.day-hero{padding:20px 4px 8px;}
.day-hero .greet{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.3;}
.day-hero .greet em{font-style:normal;color:var(--moss);}
.day-hero .meta{font-size:12px;color:var(--ink-3);letter-spacing:1px;margin-top:6px;}
.day-hero .meta b{color:var(--ink-2);font-weight:500;}

.life-index{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:18px 0;}
.life-index .li{background:var(--surface);padding:14px 8px;text-align:center;}
.life-index .li .ico{width:22px;height:22px;margin:0 auto 6px;color:var(--moss);}
.life-index .li .v{font-family:var(--serif);font-size:18px;}
.life-index .li .l{font-size:10px;color:var(--ink-3);letter-spacing:1px;margin-top:2px;}

.mood-row{display:flex;gap:8px;justify-content:space-between;margin-top:4px;}
.mood-row .m{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:var(--radius);font-size:20px;background:var(--surface);}
.mood-row .m:active,.mood-row .m.on{background:var(--moss-soft);border-color:var(--moss);}

.today-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;}
.today-block .tb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.today-block .tb-head .t{font-family:var(--serif);font-size:15px;}
.today-block .tb-head .c{font-size:12px;color:var(--ink-3);}
.mini-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.mini-list li:last-child{border-bottom:none;}
.mini-list .dot{width:6px;height:6px;border-radius:50%;background:var(--moss);flex-shrink:0;}
.mini-list .dot.clay{background:var(--clay);}
.mini-list .dot.gold{background:var(--gold);}
.mini-list .txt{flex:1;font-size:13px;}
.mini-list .sub{font-size:11px;color:var(--ink-3);}
.mini-list .empty{padding:18px 0;text-align:center;color:var(--ink-3);font-size:13px;}
.chk{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chk.on{background:var(--moss);border-color:var(--moss);}
.chk.on svg{width:12px;height:12px;color:#fff;}
.quick-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.quick-add .q{flex:1;min-width:120px;padding:10px;border:1px dashed var(--line-2);border-radius:var(--radius);font-size:12px;color:var(--ink-2);text-align:center;background:var(--bg);}
.quick-add .q:active{border-color:var(--moss);color:var(--moss);}

/* ============ 账本 ============ */
.acc-overview{padding:18px 4px;}
.acc-overview .bal{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.5px;}
.acc-overview .bal .sym{font-size:15px;color:var(--ink-3);margin-right:4px;}
.acc-overview .bal .neg{color:var(--clay);}
.acc-overview .sub{font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:.5px;}
.acc-overview .sub b{color:var(--moss);font-weight:500;}
.acc-overview .sub b.less{color:var(--clay);}
.acc-tabs{display:flex;gap:0;margin:16px 0 12px;border-bottom:1px solid var(--line);}
.acc-tabs .t{padding:8px 14px;font-size:13px;color:var(--ink-3);position:relative;}
.acc-tabs .t.on{color:var(--ink);}
.acc-tabs .t.on:after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--moss);}

.budget-bar{margin:6px 0 4px;}
.budget-bar .bb-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;}
.budget-bar .bb-track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
.budget-bar .bb-fill{height:100%;background:var(--moss);border-radius:3px;transition:width .4s;}
.budget-bar .bb-fill.warn{background:var(--gold);}
.budget-bar .bb-fill.over{background:var(--clay);}

.struct-chart{display:flex;align-items:center;gap:16px;padding:10px 0;}
.struct-chart svg{flex-shrink:0;}
.struct-legend{flex:1;font-size:12px;}
.struct-legend .sl{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
.struct-legend .sl .lf{display:flex;align-items:center;gap:6px;}
.struct-legend .sw{width:9px;height:9px;border-radius:2px;}

.tx-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.tx-list li:active{background:var(--surface-2);}
.tx-list li:last-child{border-bottom:none;}
.tx-list .cat-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;flex-shrink:0;}
.tx-list .info{flex:1;}
.tx-list .info .n{font-size:14px;}
.tx-list .info .d{font-size:11px;color:var(--ink-3);margin-top:1px;}
.tx-list .amt{font-family:var(--serif);font-size:15px;}
.tx-list .amt.in{color:var(--moss);}
.tx-list .amt.out{color:var(--ink);}

/* 明细按日分组 */
.tx-day{padding:10px 0 2px;}
.tx-day + .tx-day{border-top:1px solid var(--line);}
.tx-day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);margin:4px 0 0;}
.tx-day-head .tx-day-sum{font-size:11px;color:var(--ink-3);}
.tx-day-sum b{font-family:var(--serif);font-weight:400;}
.tx-day-sum b.in{color:var(--moss);}
.tx-day .tx-list li:last-child{border-bottom:none;}

/* 明细搜索框 */
.search-bar{margin:10px 0 2px;}
.search-bar input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:13px;color:var(--ink);}
.search-bar input:focus{outline:none;border-color:var(--moss);}

.filter-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;-webkit-overflow-scrolling:touch;}
.filter-chips::-webkit-scrollbar{display:none;}
.filter-chips .chip{flex-shrink:0;padding:5px 12px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--ink-2);background:var(--surface);}
.filter-chips .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.month-pick{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0 14px;}
.month-pick .arrow{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
.month-pick .arrow:active{background:var(--surface-2);}
.month-pick .m{font-family:var(--serif);font-size:17px;}

/* ============ 习惯 ============ */
.habit-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px;}
.habit-item .hi-top{display:flex;align-items:center;justify-content:space-between;}
.habit-item .hi-name{font-size:15px;display:flex;align-items:center;gap:8px;}
.habit-item .hi-name .pd{width:8px;height:8px;border-radius:50%;}
.habit-item .hi-type{font-size:10px;color:var(--ink-3);letter-spacing:1px;}
.habit-item .hi-mid{display:flex;align-items:center;justify-content:space-between;margin:10px 0;}
.habit-item .hi-action{display:flex;align-items:center;gap:10px;}
.habit-item .hi-action .v{font-family:var(--serif);font-size:20px;min-width:40px;text-align:center;}
.habit-item .hbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-2);}
.habit-item .hbtn:active{border-color:var(--moss);color:var(--moss);}
.habit-item .hbtn.done{background:var(--moss);border-color:var(--moss);color:#fff;}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:10px;}
.heat .h{aspect-ratio:1;border-radius:2px;background:var(--surface-2);}
.heat .h.l1{background:#D8E0D2;}
.heat .h.l2{background:#A8BC9E;}
.heat .h.l3{background:#6E8A5F;}
.heat .h.l4{background:var(--moss);}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--ink-3);margin-top:6px;}
.heat-legend .lg{width:10px;height:10px;border-radius:2px;}

/* ============ 健身 ============ */
.fit-hero{text-align:center;padding:16px 0 8px;}
.fit-hero .weight{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-1px;}
.fit-hero .weight .u{font-size:14px;color:var(--ink-3);margin-left:4px;}
.fit-hero .delta{font-size:12px;color:var(--ink-3);margin-top:4px;}
.fit-hero .delta b{font-weight:500;}
.fit-hero .delta b.down{color:var(--moss);}
.fit-hero .delta b.up{color:var(--clay);}

.fit-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.fit-stats .fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;text-align:center;}
.fit-stats .fs .v{font-family:var(--serif);font-size:18px;}
.fit-stats .fs .l{font-size:10px;color:var(--ink-3);letter-spacing:1px;margin-top:3px;}
.fit-stats .fs .v.good{color:var(--moss);}
.fit-stats .fs .v.warn{color:var(--clay);}

.goal-progress{margin:16px 0;}
.goal-progress .gp-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;}
.goal-progress .gp-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.goal-progress .gp-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--gold));border-radius:4px;}

.fit-chart{margin:14px 0;}
.fit-chart svg{width:100%;height:auto;display:block;}

.week-plan{margin-top:14px;}
.week-plan .wp-day{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.week-plan .wp-day:last-child{border-bottom:none;}
.week-plan .wp-d{width:28px;font-family:var(--serif);font-size:16px;color:var(--ink-2);text-align:center;}
.week-plan .wp-d.on{color:var(--moss);}
.week-plan .wp-c{flex:1;font-size:13px;color:var(--ink-2);}

/* ============ 日程 ============ */
.cal{margin:10px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 10px 8px;}
.cal .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px;}
.cal .cal-head .m{font-family:var(--serif);font-size:16px;}
.cal .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal .cal-grid .wk{font-size:10px;color:var(--ink-3);text-align:center;padding:6px 0;}
.cal .cal-grid .dc{text-align:center;padding:9px 0;font-size:13px;color:var(--ink-2);border-radius:8px;position:relative;cursor:pointer;}
.cal .cal-grid .dc:active{background:var(--surface-2);}
.cal .cal-grid .dc.today{box-shadow:inset 0 0 0 1.5px var(--ink);}
.cal .cal-grid .dc.has:after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--clay);}
.cal .cal-grid .dc.sel{background:var(--moss);color:#fff;}
.cal .cal-grid .dc.sel.has:after{background:#fff;}
.cal .cal-grid .dc.other{color:var(--line-2);}

.sched-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.sched-item .icon-btn{flex-shrink:0;}
.sched-item:last-child{border-bottom:none;}
.sched-item .time{font-family:var(--serif);font-size:13px;color:var(--ink-2);width:54px;flex-shrink:0;padding-top:1px;}
.sched-item .time .t2{font-size:10px;color:var(--ink-3);}
.sched-item .si-body{flex:1;}
.sched-item .si-body .t{font-size:14px;}
.sched-item .si-body .t.done{text-decoration:line-through;color:var(--ink-3);}
.sched-item .si-body .cat{font-size:11px;color:var(--ink-3);margin-top:2px;}

/* ============ 待买 ============ */
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.shop-item:last-child{border-bottom:none;}
.shop-item .info{flex:1;}
.shop-item .info .n{font-size:14px;}
.shop-item .info .n.done{color:var(--ink-3);text-decoration:line-through;}
.shop-item .info .sub{font-size:11px;color:var(--ink-3);margin-top:1px;}
.shop-item .price{font-family:var(--serif);font-size:13px;color:var(--ink-2);}

/* ============ 收藏 ============ */
.coll-tabs{display:flex;gap:16px;margin:10px 0 14px;}
.coll-tabs .t{font-size:13px;color:var(--ink-3);padding:6px 0;position:relative;}
.coll-tabs .t.on{color:var(--ink);}
.coll-tabs .t.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--moss);}

.view-toggle{display:flex;gap:4px;margin-bottom:12px;}
.view-toggle .vt{padding:4px 10px;font-size:11px;border:1px solid var(--line);border-radius:12px;color:var(--ink-3);}
.view-toggle .vt.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.wall .wc{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative;display:flex;align-items:flex-end;}
.wall .wc .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;color:var(--ink-3);text-align:center;padding:8px;}
.wall .wc .ov{position:relative;background:linear-gradient(transparent 40%,rgba(0,0,0,.7));color:#fff;padding:8px;font-size:11px;width:100%;}
.wall .wc .ov .st{color:var(--gold);font-size:10px;}
.wall .wc .cover-img{position:absolute;inset:0;background-size:cover;background-position:center;}

.coll-list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.coll-list-item:last-child{border-bottom:none;}
.coll-list-item .poster{width:48px;height:64px;border-radius:4px;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:11px;color:var(--ink-3);overflow:hidden;}
.coll-list-item .ci-body{flex:1;}
.coll-list-item .ci-body .t{font-size:14px;}
.coll-list-item .ci-body .a{font-size:11px;color:var(--ink-3);margin-top:1px;}
.coll-list-item .ci-body .st{color:var(--gold);font-size:11px;margin-top:3px;letter-spacing:1px;}
.coll-list-item .ci-body .nt{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.4;}

.stars{color:var(--gold);font-size:12px;letter-spacing:1px;}

.year-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.year-stat .ys{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px;text-align:center;}
.year-stat .ys .v{font-family:var(--serif);font-size:22px;}
.year-stat .ys .l{font-size:10px;color:var(--ink-3);letter-spacing:1px;margin-top:3px;}

/* ============ 设置/备份 ============ */
.set-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);}
.set-item:first-child{border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.set-item:last-child{border-bottom:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);}
.set-item .s-l{font-size:14px;}
.set-item .s-r{font-size:12px;color:var(--ink-3);}
.set-item:active{background:var(--surface-2);}

/* ============ 历史版本 ============ */
.hist-intro{font-size:12px;color:var(--ink-3);line-height:1.7;padding:4px 4px 14px;}
.hist-item{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);}
.hist-item:first-of-type{border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.hist-item:last-of-type{border-bottom:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.hist-ver{font-family:var(--serif);font-size:16px;color:var(--ink);}
.hist-date{font-size:11px;color:var(--ink-3);letter-spacing:.5px;}
.hist-title{font-size:13px;color:var(--ink-2);margin-bottom:6px;}
.hist-notes{font-size:12px;color:var(--ink-3);line-height:1.7;}

.stat-banner{background:var(--ink);color:var(--bg);border-radius:var(--radius-lg);padding:16px;margin:14px 0;}
.stat-banner .sb-l{font-size:11px;letter-spacing:2px;color:var(--ink-3);}
.stat-banner .sb-v{font-family:var(--serif);font-size:24px;margin-top:4px;}
.stat-banner .sb-v b{color:var(--gold);}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-3);}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4;}
.empty-state .t{font-family:var(--serif);font-size:15px;}
.empty-state .s{font-size:12px;margin-top:4px;}

/* 数字键盘样式 */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px;}
.numpad .nk{background:var(--surface);padding:14px 0;text-align:center;font-family:var(--serif);font-size:20px;}
.numpad .nk:active{background:var(--surface-2);}
.numpad .nk.op{color:var(--ink-3);}

.fab{position:fixed;right:20px;bottom:80px;width:50px;height:50px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(28,27,24,.2);z-index:10;}
.fab:active{transform:scale(.94);}
.fab svg{width:22px;height:22px;}

.list-fade{opacity:.5;pointer-events:none;}

@media(max-width:360px){
  .page{padding:8px 14px 100px;}
  .app-header{padding:14px 14px 10px;}
}
</style>
</head>

  <nav class="tabbar">

<script>
/* ========================================================
   栖 · 生活工作台  —— 单文件应用
   数据持久化：localStorage  / 备份：JSON 导出导入
   ======================================================== */
(function(){
'use strict';

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const nowTime=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;};
const fmtDT=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;};
const normTime=t=>{if(!t)return '';const p=t.split(':');if(p.length===1)return p[0].padStart(2,'0')+':00:00';if(p.length===2)return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0')+':00';return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0')+':'+(p[2]||'00').padStart(2,'0');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtMoney=n=>{n=Math.round(n*100)/100;return n.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});};
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const daysAgoStr=n=>{const d=new Date();d.setDate(d.getDate()-n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const monthStr=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg,ms=1800){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);
}

// 分类展示常量（账本共用，避免重复定义）
const CAT_EMOJI={'餐饮':'🍽','交通':'🚇','购物':'🛍','居家':'🏠','娱乐':'🎬','健康':'💊','工资':'💼','其他':'·'};
const CAT_COLORS={'餐饮':'#B5604A','交通':'#5A7A86','购物':'#B89254','居家':'#3F5340','娱乐':'#8A6E9E','健康':'#6E8A5F','工资':'#9A958A','其他':'#9A958A'};
const CAT_BG={'餐饮':'#F0E0D8','交通':'#DDE6E8','购物':'#F0E9D6','居家':'#E4E9DF','娱乐':'#E8E0EC','健康':'#DDE8D6','工资':'#E4E9DF','其他':'#EEE9DC'};

// 全量记录数（多处共用）
const countEntries=()=>
  DB.accounts.transactions.length+DB.habits.items.length+Object.keys(DB.habits.logs).length+
  DB.fitness.records.length+DB.schedule.events.length+DB.shopping.items.length+DB.collection.items.length;

/* ---------- 数据层 ---------- */
const STORAGE_KEY='qixi_life_data_v1';
const SCHEMA_VERSION=1;

// 存储：优先 Android 原生文件存储（APP 私有目录），浏览器/无桥环境降级 localStorage，最后内存兜底
const _memStore={};
function safeGetItem(k){
  if(window.Android&&typeof window.Android.loadData==='function'){
    try{const v=window.Android.loadData(k);if(v!=null)return v;}catch(e){}
  }
  try{return localStorage.getItem(k);}catch(e){return _memStore[k]||null;}
}
function safeSetItem(k,v){
  if(window.Android&&typeof window.Android.saveData==='function'){
    try{window.Android.saveData(k,v);return true;}catch(e){}
  }
  try{localStorage.setItem(k,v);return true;}catch(e){_memStore[k]=v;return false;}
}

function defaultData(){
  return {
    meta:{version:SCHEMA_VERSION,createdAt:Date.now(),lastBackup:null,backupReminderCount:0},
    accounts:{
      transactions:[],
      budget:{monthly:5000,categories:{}}
    },
    habits:{items:[],logs:{}},
    fitness:{records:[],goal:{targetWeight:60,height:1.70,startDate:daysAgoStr(30),startWeight:70,weeklyPlan:{1:'上肢训练',2:'有氧 30 分',3:'下肢训练',4:'休息',5:'核心 + 有氧',6:'长距离慢跑',7:'休息'}}},
    schedule:{events:[]},
    shopping:{items:[]},
    collection:{items:[],view:'wall'},
    lifeIndex:{moodLogs:{},notes:{}}
  };
}

let DB=null;
const isObject=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
const isDateString=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value);
const safeText=(value,maxLength=200)=>String(value??'').replace(/[\u0000-\u001f<>&"'`]/g,'').trim().slice(0,maxLength);
const safeId=(value,prefix)=>/^[A-Za-z0-9_-]{6,80}$/.test(String(value||''))?String(value):`${prefix}_${uid()}`;
const numberIn=(value,fallback,min,max)=>{
  const number=Number(value);
  return Number.isFinite(number)&&number>=min&&number<=max?number:fallback;
};
const safeTime=value=>{
  if(typeof value!=='string'||!/^\d{2}:\d{2}(?::\d{2})?$/.test(value))return '';
  const [hour,minute,second='00']=value.split(':').map(Number);
  return hour<24&&minute<60&&second<60?normTime(value):'';
};
function normalizeData(data){
  const fallback=defaultData();
  if(!isObject(data))return fallback;
  data.meta=isObject(data.meta)?data.meta:fallback.meta;
  data.meta.eventNotified=isObject(data.meta.eventNotified)?data.meta.eventNotified:{};
  data.accounts=isObject(data.accounts)?data.accounts:fallback.accounts;
  data.accounts.transactions=(Array.isArray(data.accounts.transactions)?data.accounts.transactions:[]).filter(isObject).flatMap((item,index)=>{
    if(!isDateString(item.date))return [];
    const amount=numberIn(item.amount,0,0.01,100000000);
    if(!amount)return [];
    return [{id:safeId(item.id,`tx${index}`),type:item.type==='income'?'income':'expense',amount,category:safeText(item.category,30)||'其他',note:safeText(item.note,500),date:item.date,time:safeTime(item.time)}];
  });
  data.accounts.budget=isObject(data.accounts.budget)?data.accounts.budget:fallback.accounts.budget;
  data.accounts.budget.monthly=numberIn(data.accounts.budget.monthly,5000,0,100000000);
  data.accounts.budget.categories=isObject(data.accounts.budget.categories)?data.accounts.budget.categories:{};
  data.accounts.budget.categories=Object.entries(data.accounts.budget.categories).reduce((result,[category,value])=>{
    const budget=numberIn(value,0,0,100000000);
    const name=safeText(category,30);
    if(name&&budget>0)result[name]=budget;
    return result;
  },{});
  data.habits=isObject(data.habits)?data.habits:fallback.habits;
  data.habits.items=(Array.isArray(data.habits.items)?data.habits.items:[]).filter(isObject).flatMap((item,index)=>{
    const type=['check','count','value'].includes(item.type)?item.type:'check';
    const name=safeText(item.name,80);if(!name)return [];
    const color=/^#[0-9a-fA-F]{6}$/.test(item.color||'')?item.color:'#3F5340';
    return [{id:safeId(item.id,`habit${index}`),name,type,target:numberIn(item.target,1,0.01,1000000),color,unit:safeText(item.unit,20),createdAt:isDateString(item.createdAt)?item.createdAt:todayStr()}];
  });
  const habitIds=new Set(data.habits.items.map(item=>item.id));
  const rawLogs=isObject(data.habits.logs)?data.habits.logs:{};
  data.habits.logs={};
  Object.entries(rawLogs).forEach(([habitId,logs])=>{
    if(!habitIds.has(habitId)||!isObject(logs))return;
    const cleanLogs={};
    Object.entries(logs).forEach(([date,value])=>{if(isDateString(date)){const amount=numberIn(value,0,0,1000000);if(amount)cleanLogs[date]=amount;}});
    data.habits.logs[habitId]=cleanLogs;
  });
  data.fitness=isObject(data.fitness)?data.fitness:fallback.fitness;
  data.fitness.records=(Array.isArray(data.fitness.records)?data.fitness.records:[]).filter(isObject).flatMap((item,index)=>{
    if(!isDateString(item.date))return [];
    const weight=numberIn(item.weight,0,1,1000);if(!weight)return [];
    return [{id:safeId(item.id,`fit${index}`),date:item.date,weight,bodyFat:numberIn(item.bodyFat,0,0,100),note:safeText(item.note,500)}];
  });
  data.fitness.goal=isObject(data.fitness.goal)?deepMerge(fallback.fitness.goal,data.fitness.goal):fallback.fitness.goal;
  data.fitness.goal.targetWeight=numberIn(data.fitness.goal.targetWeight,60,1,1000);
  data.fitness.goal.height=numberIn(data.fitness.goal.height,1.7,0.5,3);
  data.fitness.goal.startWeight=numberIn(data.fitness.goal.startWeight,70,1,1000);
  data.fitness.goal.startDate=isDateString(data.fitness.goal.startDate)?data.fitness.goal.startDate:todayStr();
  const rawPlan=isObject(data.fitness.goal.weeklyPlan)?data.fitness.goal.weeklyPlan:{};
  data.fitness.goal.weeklyPlan={};
  for(let day=1;day<=7;day++)data.fitness.goal.weeklyPlan[day]=safeText(rawPlan[day],80)||fallback.fitness.goal.weeklyPlan[day];
  data.schedule=isObject(data.schedule)?data.schedule:fallback.schedule;
  data.schedule.events=(Array.isArray(data.schedule.events)?data.schedule.events:[]).filter(isObject).flatMap((item,index)=>{
    const title=safeText(item.title,160);if(!title||!isDateString(item.date))return [];
    return [{id:safeId(item.id,`event${index}`),title,date:item.date,time:safeTime(item.time),category:safeText(item.category,30)||'其他',note:safeText(item.note,500),done:Boolean(item.done)}];
  });
  data.shopping=isObject(data.shopping)?data.shopping:fallback.shopping;
  data.shopping.items=(Array.isArray(data.shopping.items)?data.shopping.items:[]).filter(isObject).flatMap((item,index)=>{
    const name=safeText(item.name,120);if(!name)return [];
    return [{id:safeId(item.id,`shop${index}`),name,category:safeText(item.category,30)||'未分类',qty:Math.floor(numberIn(item.qty,1,1,100000)),price:numberIn(item.price,0,0,100000000),bought:Boolean(item.bought),boughtAt:safeText(item.boughtAt,40)}];
  });
  data.collection=isObject(data.collection)?data.collection:fallback.collection;
  data.collection.items=(Array.isArray(data.collection.items)?data.collection.items:[]).filter(isObject).flatMap((item,index)=>{
    const title=safeText(item.title,160);if(!title)return [];
    const type=['book','movie','music'].includes(item.type)?item.type:'book';
    const color=/^#[0-9a-fA-F]{6}$/.test(item.coverColor||'')?item.coverColor:'#7A5C3E';
    return [{id:safeId(item.id,`collection${index}`),type,title,author:safeText(item.author,120),status:safeText(item.status,30),rating:Math.floor(numberIn(item.rating,0,0,5)),note:safeText(item.note,1000),coverColor:color,date:isDateString(item.date)?item.date:todayStr()}];
  });
  data.collection.view=data.collection.view==='list'?'list':'wall';
  data.lifeIndex=isObject(data.lifeIndex)?data.lifeIndex:fallback.lifeIndex;
  data.lifeIndex.moodLogs=isObject(data.lifeIndex.moodLogs)?data.lifeIndex.moodLogs:{};
  data.lifeIndex.notes=isObject(data.lifeIndex.notes)?data.lifeIndex.notes:{};
  data.lifeIndex.moodLogs=Object.entries(data.lifeIndex.moodLogs).reduce((result,[date,value])=>{
    if(isDateString(date))result[date]=Math.floor(numberIn(value,0,0,5));
    return result;
  },{});
  data.lifeIndex.notes=Object.entries(data.lifeIndex.notes).reduce((result,[date,value])=>{
    if(isDateString(date))result[date]=safeText(value,1000);
    return result;
  },{});
  return data;
}

function loadData(){
  try{
    const raw=safeGetItem(STORAGE_KEY);
    if(!raw){DB=defaultData();saveData(true);return DB;}
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object'||!parsed.meta)throw new Error('数据格式异常');
    // 简单迁移：补字段
    const def=defaultData();
    DB=normalizeData(deepMerge(def,parsed));
    DB.meta.version=SCHEMA_VERSION;
    return DB;
  }catch(e){
    console.error('数据加载失败',e);
    // 数据损坏：尝试从备份恢复
    const backup=safeGetItem(STORAGE_KEY+'_bak');
    if(backup){
      try{
        const parsed=JSON.parse(backup);
        if(parsed&&parsed.meta){
          DB=normalizeData(deepMerge(defaultData(),parsed));
          toast('检测到数据损坏，已从自动备份恢复',3000);
          saveData(true);
          return DB;
        }
      }catch(e2){}
    }
    // 无备份，提示用户
    DB=defaultData();
    toast('数据损坏且无备份，已重置为初始状态',3000);
    saveData(true);
    return DB;
  }
}

function deepMerge(base,over){
  if(Array.isArray(base))return over!==undefined?over:base;
  if(typeof base==='object'&&base!==null){
    const r={...base};
    for(const k in over){
      if(k in base&&typeof base[k]==='object'&&base[k]!==null&&!Array.isArray(base[k])&&typeof over[k]==='object'&&over[k]!==null){
        r[k]=deepMerge(base[k],over[k]);
      }else{
        r[k]=over[k];
      }
    }
    return r;
  }
  return over!==undefined?over:base;
}

function saveData(silent){
  try{
    const json=JSON.stringify(DB);
    // 先写备份再写主数据
    const prev=safeGetItem(STORAGE_KEY);
    if(prev)safeSetItem(STORAGE_KEY+'_bak',prev);
    safeSetItem(STORAGE_KEY,json);
    if(!silent){
      // 检查是否需要提醒备份
      checkBackupReminder();
    }
    return true;
  }catch(e){
    console.error('保存失败',e);
    toast('存储失败：可能空间已满，请导出备份后清理',3000);
    return false;
  }
}

function checkBackupReminder(){
  const totalEntries=countEntries();
  // 满 20 条新数据提醒一次（基于计数差）
  if(!DB.meta.lastBackupCount)DB.meta.lastBackupCount=0;
  const delta=totalEntries-(DB.meta.lastBackupCount||0);
  if(delta>=20){
    DB.meta.lastBackupCount=totalEntries;
    saveData(true);
    setTimeout(()=>{
      confirmModal({
        title:'建议备份',
        body:'已新增较多数据，建议导出备份文件以防丢失。',
        confirmText:'现在导出',
        cancelText:'稍后',
        onConfirm:()=>exportBackup()
      });
    },500);
  }
}

function triggerDownload(filename, content, mime){
  if(window.Android && typeof window.Android.exportFile==='function'){
    try{window.Android.exportFile(filename, content, mime);return;}catch(e){}
  }
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportBackup(){
  try{
    const json=JSON.stringify(DB,null,2);
    // 固定文件名：最新备份覆盖历史备份
    triggerDownload('qixi-backup.json', json, 'application/json');
    DB.meta.lastBackup=new Date().toISOString();
    DB.meta.lastBackupCount=countEntries();
    saveData(true);
    if(currentPage==='settings')renderSettings();
    toast('备份已导出',1500);
  }catch(e){toast('导出失败',1500);}
}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.meta||!parsed.meta.version)throw new Error('无效备份');
      confirmModal({
        title:'导入备份',
        body:'导入将覆盖当前所有数据，确定继续？',
        confirmText:'导入',
        danger:true,
        onConfirm:()=>{
          DB=normalizeData(deepMerge(defaultData(),parsed));
          saveData(true);
          renderAll();
          toast('备份已恢复',1500);
        }
      });
    }catch(err){
      toast('备份文件无效或已损坏',2500);
    }
  };
  reader.readAsText(file);
}

function showPage(page){
  currentPage=page;
  $$('.page').forEach(p=>p.classList.remove('active'));

  $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));

  const titles={today:'栖',account:'账本',habit:'习惯',fitness:'身体',collection:'收藏',schedule:'日程',shopping:'待买',settings:'设置',about:'关于'};
  const subs={today:'LIFE STATION',account:'LEDGER',habit:'HABITS',fitness:'BODY',collection:'ARCHIVE',schedule:'SCHEDULE',shopping:'SHOPPING',settings:'SETTINGS',about:'ABOUT'};
  const showBack=SUB_PAGES[page]&&navStack.length>1;
  $('#hdrTitle').innerHTML=`${showBack?'<span class="hdr-back" onclick="goBack()">‹</span>':''}${titles[page]||'栖'}<small>${subs[page]||'LIFE STATION'}</small>`;

  renderPage(page);
  $('.main').scrollTop=0;
  // tab 高亮：子页面归属
  const tabMap={schedule:'today',shopping:'today',settings:'today',about:'today'};
  if(tabMap[page]){
    $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===tabMap[page]));

window.goBack=function(){
  if(navStack.length<=1)return;
  navStack.pop();
  showPage(navStack[navStack.length-1]);
};
window.handleAndroidBack=function(){
  const modal=$('.modal-backdrop');
  if(modal){modal.querySelector('.cancel').click();return true;}
  if($('#sheet').classList.contains('show')){closeSheet();return true;}
  if(currentPage!=='today'){goBack();return true;}
  return false;
};

  $$('#filterChips .chip').forEach(el=>{

  });
  $$('#catChips .chip').forEach(el=>{

  });
}

function renderDonut(data,total){
  if(!data.length)return '<svg width="100" height="100"></svg>';
  const r=42,cx=50,cy=50;
  let acc=0;
  const circ=2*Math.PI*r;
  let segs='';
  data.forEach(d=>{
    const frac=d.value/total;
    const dash=frac*circ;
    const offset=-acc*circ;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="12" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=frac;
  });
  return `<svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#EFEADD" stroke-width="12"/>${segs}<text x="50" y="48" text-anchor="middle" font-family="Georgia" font-size="11" fill="#9A958A">合计</text><text x="50" y="62" text-anchor="middle" font-family="Georgia" font-size="13" fill="#1C1B18">¥${fmtMoney(total)}</text></svg>`;
}

function renderMonthCompare(curD){
  // 最近6个月支出柱状
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(curD);d.setMonth(d.getMonth()-i);
    const ms=monthStr(d);
    const exp=DB.accounts.transactions.filter(x=>x.date.startsWith(ms)&&x.type==='expense').reduce((s,x)=>s+x.amount,0);
    months.push({label:(d.getMonth()+1)+'月',exp,isCur:i===0});
  }
  const max=Math.max(...months.map(m=>m.exp),1);
  const barW=32;
  return `<div style="display:flex;align-items:flex-end;justify-content:space-between;height:120px;padding:10px 0 0">
    ${months.map(m=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="font-size:10px;color:var(--ink-3);font-family:var(--serif)">${m.exp?Math.round(m.exp):''}</div>
      <div style="width:${barW}px;height:${Math.max(4,m.exp/max*80)}px;background:${m.isCur?'var(--moss)':'var(--line-2)'};border-radius:3px 3px 0 0"></div>
      <div style="font-size:10px;color:${m.isCur?'var(--ink)':'var(--ink-3)'}">${m.label}</div>
    </div>`).join('')}
  </div>`;
}

function renderHabit(){
  const items=DB.habits.items;
  const html=`
    <div class="section">
      <div class="section-head"><h2>我的习惯</h2><span class="more" onclick="openHabitSheet()">＋ 新建</span></div>
      ${items.length?items.map(h=>{
        const log=DB.habits.logs[h.id]||{};
        const todayV=log[todayStr()]||0;
        let done=false,display='';
        if(h.type==='check'){done=todayV>=1;display=done?'已完成':'未完成';}
        else if(h.type==='count'){done=todayV>=h.target;display=`${todayV} / ${h.target}`;}
        else{done=todayV>=h.target;display=`${todayV}${h.unit||''} / ${h.target}${h.unit||''}`;}
        // 30天热力图
        const heat=[];
        for(let i=29;i>=0;i--){
          const ds=daysAgoStr(i);
          const v=log[ds]||0;
          let lvl=0;
          if(h.type==='check')lvl=v>=1?4:0;
          else{const p=h.target?v/h.target:0;lvl=p>=1?4:p>=0.75?3:p>=0.5?2:p>0?1:0;}
          heat.push(`<div class="h l${lvl}" title="${ds}: ${v}"></div>`);
        }
        // 连续天数（今天还没打卡不算断档，从昨天起算）
        let streak=0;
        for(let i=0;i<30;i++){
          const ds=daysAgoStr(i);
          const v=log[ds]||0;
          const ok=h.type==='check'?v>=1:v>0;
          if(ok){streak++;continue;}
          if(i===0)continue;
          break;
        }
        return `<div class="habit-item">
          <div class="hi-top">
            <div class="hi-name" style="cursor:pointer" onclick="openHabitEdit('${h.id}')"><span class="pd" style="background:${h.color}"></span>${escapeHTML(h.name)}</div>
            <button class="icon-btn" onclick="delHabit('${h.id}')" style="width:28px;height:28px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
          <div class="hi-type">${h.type==='check'?'勾选':h.type==='count'?'计数':'数值'} · 连续 ${streak} 天</div>
          <div class="hi-mid">
            <div class="hi-action">
              ${h.type==='check'?
                `<button class="hbtn ${done?'done':''}" onclick="quickHabit('${h.id}')">${done?'<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg>':'✓'}</button>`:

        ${records.slice(-5).reverse().map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="openFitDetail('${r.id}')">

function calcBMI(w,height){
  const h=height||1.70;return (w/(h*h)).toFixed(1);
}
function calcAvg7(records){
  const last7=records.slice(-7);
  if(!last7.length)return 0;
  return last7.reduce((s,r)=>s+r.weight,0)/last7.length;
}
function calcGoalPct(records,goal){
  if(!records.length)return 0;
  const last=records[records.length-1];
  const total=goal.startWeight-goal.targetWeight;
  if(total<=0)return 0;
  const done=goal.startWeight-last.weight;
  return Math.max(0,Math.min(100,Math.round(done/total*100)));
}
function calcDailyDeficit(records,goal){
  if(records.length<2)return 0;
  const last=records[records.length-1];
  const first=records[0];
  const days=(parseDate(last.date)-parseDate(first.date))/86400000;
  if(days<=0)return 0;
  const perDay=(first.weight-last.weight)/days;
  // 1kg 脂肪 ≈ 7700kcal
  const deficit=Math.round(perDay*7700);
  return deficit>0?deficit:0;
}
function calcETA(records,goal){
  const last=records[records.length-1];
  const remain=last.weight-goal.targetWeight;
  if(remain<=0)return 0;
  const deficit=calcDailyDeficit(records,goal);
  if(deficit<=0)return Math.round(remain/0.05);
  return Math.round(remain*7700/deficit);
}
function renderWeightChart(records){
  if(records.length<2)return '<div style="text-align:center;color:var(--ink-3);font-size:12px;padding:20px 0">至少需要 2 条记录</div>';
  const data=records.slice(-30);
  const W=300,H=140,pad=24;
  const weights=data.map(r=>r.weight);
  const min=Math.min(...weights)-0.5,max=Math.max(...weights)+0.5;
  const range=max-min||1;
  const xStep=(W-pad*2)/Math.max(1,data.length-1);
  const points=data.map((r,i)=>[pad+i*xStep,H-pad-((r.weight-min)/range)*(H-pad*2)]);
  // 7日均线
  const avgLine=[];
  for(let i=0;i<data.length;i++){
    const slice=data.slice(Math.max(0,i-6),i+1);
    const avg=slice.reduce((s,r)=>s+r.weight,0)/slice.length;
    avgLine.push([pad+i*xStep,H-pad-((avg-min)/range)*(H-pad*2)]);
  }
  const path=points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const avgPath=avgLine.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${points[points.length-1][0].toFixed(1)} ${H-pad} L${points[0][0].toFixed(1)} ${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="max-height:160px">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3F5340" stop-opacity="0.15"/><stop offset="100%" stop-color="#3F5340" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#wg)"/>
    <path d="${avgPath}" fill="none" stroke="#B89254" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="${path}" fill="none" stroke="#3F5340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((p,i)=>i===points.length-1?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#3F5340"/>`:'').join('')}
    <text x="${pad}" y="${H-6}" font-size="9" fill="#9A958A">${data[0].date.slice(5)}</text>
    <text x="${W-pad}" y="${H-6}" font-size="9" fill="#9A958A" text-anchor="end">${data[data.length-1].date.slice(5)}</text>
  </svg>`;
}

function renderSchedule(){

  const year=d.getFullYear(),month=d.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=todayStr();
  const events=DB.schedule.events;

  let calHTML='<div class="cal"><div class="cal-head"><div class="m">'+year+'年'+(month+1)+'月</div><div><button class="icon-btn" onclick="schedPrevMonth()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><button class="icon-btn" onclick="schedToday()">今</button><button class="icon-btn" onclick="schedNextMonth()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div><div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=>calHTML+=`<div class="wk">${w}</div>`);
  for(let i=0;i<firstDay;i++)calHTML+='<div class="dc other"></div>';
  for(let dd=1;dd<=daysInMonth;dd++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=events.some(e=>e.date===ds);
    const cls=[];
    if(ds===today)cls.push('today');
    if(ds===schedCurDate)cls.push('sel');
    if(has)cls.push('has');
    calHTML+=`<div class="dc ${cls.join(' ')}" onclick="schedPick('${ds}')">${dd}</div>`;
  }
  calHTML+='</div></div>';

  const dayEvents=events.filter(e=>e.date===schedCurDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const dStr=`${d.getMonth()+1}月${d.getDate()}日`;

  $('#page-schedule').innerHTML=`
    ${calHTML}
    <div class="section">
      <div class="section-head"><h2>${dStr}的安排</h2><span class="more" onclick="openEventSheet('${schedCurDate}')">＋ 添加</span></div>
      <div class="card">
        ${dayEvents.length?`<ul class="mini-list" style="list-style:none">
          ${dayEvents.map(e=>`<li class="sched-item" style="cursor:pointer" onclick="openEventDetail('${e.id}')">
            <div class="time">${e.time||'全天'}${e.time?`<div class="t2">${e.category}</div>`:''}</div>
            <div class="si-body"><div class="t ${e.done?'done':''}">${escapeHTML(e.title)}</div>${e.note?`<div class="cat">${escapeHTML(e.note)}</div>`:''}${!e.time?`<div class="cat">${e.category}</div>`:''}</div>
            <button class="icon-btn" aria-label="${e.done?'标记未完成':'标记完成'}" onclick="event.stopPropagation();toggleEventDone('${e.id}')" style="width:32px;height:32px"><div class="chk ${e.done?'on':''}">${e.done?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg>':''}</div></button>
          </li>`).join('')}
        </ul>`:`<div class="empty-state" style="padding:24px"><div class="t">这天没有安排</div></div>`}
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h2>待买清单</h2><span class="more" onclick="go('shopping')">管理 ›</span></div>
      <div class="card">
        ${DB.shopping.items.filter(s=>!s.bought).slice(0,5).map(s=>`<div class="shop-item"><div class="info"><div class="n">${escapeHTML(s.name)}</div><div class="sub">${s.category||''} · ${s.qty||1}件</div></div><div class="price">¥${fmtMoney(s.price||0)}</div><button class="icon-btn" onclick="toggleShop('${s.id}')" style="width:30px;height:30px"><div class="chk"></div></button></div>`).join('')||'<div class="empty-state" style="padding:20px"><div class="t">暂无待买</div></div>'}

function shade(hex,percent){
  hex=hex.replace('#','');let r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+Math.round(r*percent/100)));
  g=Math.max(0,Math.min(255,g+Math.round(g*percent/100)));
  b=Math.max(0,Math.min(255,b+Math.round(b*percent/100)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

    items=DB.shopping.items.map(s=>`<div class="set-item"><div class="s-l">${escapeHTML(s.name)}${s.boughtAt?` <span style="font-size:10px;color:var(--ink-3)">购于 ${s.boughtAt}</span>`:''}</div><div class="s-r" style="color:${s.bought?'var(--ink-3)':'var(--ink-2)'}">${s.bought?'已购':'未买'}</div></div>`).join('');
  }else if(key==='collection'){

  }

/* ---------- 自定义模态确认框（替代原生 confirm，避免 WebView 「网址为…」标题） ---------- */
function confirmModal(opts){
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';
  const card=document.createElement('div');
  card.className='modal-card';
  card.setAttribute('role','dialog');
  card.innerHTML=`
    <div class="modal-title">${escapeHTML(opts.title||'请确认')}</div>
    <div class="modal-body">${opts.body||''}</div>
    <div class="modal-actions">
      <button class="btn ghost sm cancel">${escapeHTML(opts.cancelText||'取消')}</button>
      <button class="btn ${opts.danger?'clay':'moss'} sm confirm">${escapeHTML(opts.confirmText||'确定')}</button>
    </div>
  `;
  backdrop.appendChild(card);
  document.body.appendChild(backdrop);
  // 触发动画
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  const close=()=>{
    backdrop.classList.remove('show');
    setTimeout(()=>backdrop.remove(),200);
  };
  card.querySelector('.cancel').addEventListener('click',close);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)close();});
  card.querySelector('.confirm').addEventListener('click',()=>{
    if(opts.requireSecond){
      close();
      // 二次确认
      setTimeout(()=>{
        confirmModal({
          title:opts.secondTitle||'再次确认',
          body:opts.secondBody||'操作不可撤销。',
          confirmText:opts.secondConfirmText||'仍然继续',
          danger:true,
          onConfirm:()=>{opts.onConfirm&&opts.onConfirm();}
        });
      },220);
    }else{
      close();
      opts.onConfirm&&opts.onConfirm();
    }
  });
}

/* ---------- 日程到点提醒（应用内） ---------- */
function checkEventReminders(){
  try{
    const t=todayStr();
    const now=nowTime();
    if(!DB.meta.eventNotified)DB.meta.eventNotified={};
    const due=[];
    DB.schedule.events.forEach(e=>{
      if(e.date===t&&!e.done&&e.time&&e.time<=now&&!DB.meta.eventNotified[e.id]){
        DB.meta.eventNotified[e.id]=true;
        due.push(e.title+' '+e.time);
      }
    });
    if(due.length){
      saveData(true);
      toast('⏰ '+due.join('、'),4000);
    }
  }catch(e){}
}

// ===== 把核心函数挂到 window，让 inline onclick 能找到 =====
// 脚本被 IIFE 包裹，所有 function 声明只在该作用域内可见，
// 而内联 onclick="xxx()" 在全局作用域查找 xxx，会报 ReferenceError。
// 这里用一次扫描把当前作用域内所有具名函数自动挂到 window，
// 以后再写新 function xxx() 也能默认暴露。
(function exposeForOnclick(){
  const fns=[go,closeSheet,exportBackup,calcBMI,calcDailyDeficit,calcETA,calcGoalPct,renderWeightChart,renderDonut,renderMonthCompare,renderToday,renderAccount,renderFitness,renderHabit,renderSchedule,renderShopping,renderCollection,renderSettings,renderPage,renderAll,onFAB,ensureFAB,updateFAB,openSheet,toast,saveData,defaultData,loadData,checkBackupReminder,safeGetItem,safeSetItem,importBackup,deepMerge,normalizeData,shade,triggerDownload];
  for(const f of fns){
    if(f&&f.name&&typeof window[f.name]==='undefined'){try{window[f.name]=f;}catch(e){}}
  }
})();

})();
